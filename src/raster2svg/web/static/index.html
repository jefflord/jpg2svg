<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raster2svg &mdash; live converter</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #6ea1ff;
    --star: #ffcf5c;
    --ok: #46c08a;
    --err: #ff6b6b;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-weight: 400; font-size: 14px; }
  .engine { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  main {
    display: grid; grid-template-columns: minmax(320px, 460px) minmax(0, 1fr);
    gap: 16px; padding: 16px 20px; align-items: start;
  }
  main > section { min-width: 0; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }

  /* ---- left: controls ---- */
  .upload {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 18px;
    text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s;
    margin-bottom: 14px;
  }
  .upload:hover, .upload.drag { border-color: var(--accent); background: var(--panel-2); }
  .upload button {
    background: var(--accent); color: #06101f; border: 0; padding: 6px 12px;
    border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: 4px;
  }
  .upload-status { margin-top: 8px; font-size: 12px; color: var(--ok); font-family: var(--mono); min-height: 14px; }
  .upload-thumb { margin: 10px auto 0; width: fit-content; max-width: 100%; }
  .upload-thumb img {
    display: block; max-width: 180px; max-height: 100px; border-radius: 6px;
    border: 1px solid var(--border);
    background:
      linear-gradient(45deg, #2a2f3a 25%, transparent 25%, transparent 75%, #2a2f3a 75%),
      linear-gradient(45deg, #2a2f3a 25%, transparent 25%, transparent 75%, #2a2f3a 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; background-color: #1d212b;
  }

  fieldset {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px 12px;
    margin: 0 0 14px; background: var(--panel);
  }
  fieldset.legend-star { border-color: rgba(255,207,92,.4); }
  legend { font-weight: 650; padding: 0 6px; color: var(--text); }
  legend .note { color: var(--muted); font-weight: 400; font-size: 12px; }
  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .control { display: flex; flex-direction: column; gap: 5px; }
  .control.wide { grid-column: 1 / -1; }
  .control label { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .control label .hint { color: #6b7385; font-size: 11px; }
  .control .row { display: flex; align-items: center; gap: 6px; }
  .control input, .control select {
    flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 13px; min-width: 0;
  }
  .control input:focus, .control select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .control .reset {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .control .reset:hover { color: var(--text); border-color: var(--muted); }
  .control.bool { flex-direction: row; align-items: center; justify-content: space-between; }
  .control.bool label { margin: 0; }
  .control input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .control.disabled { opacity: .45; }
  .control.disabled .unav { display: inline; }
  .unav { display: none; color: var(--star); font-size: 11px; }
  .control .starbadge { color: var(--star); font-size: 11px; font-weight: 700; }
  .control.star input { border-color: rgba(255,207,92,.5); }

  .preset-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .preset-row label { color: var(--muted); font-size: 12.5px; }
  .preset-row select, .preset-row input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; flex: 1; min-width: 0;
  }
  .preset-row input:focus, .preset-row select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .user-presets .preset-row:last-child { margin-bottom: 0; }
  .preset-desc { margin: -2px 0 8px 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .preset-desc .best { color: var(--text); }
  .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .ghost:hover { color: var(--text); border-color: var(--muted); }

  /* ---- right: preview ---- */
  .preview-pane { position: sticky; top: 66px; display: flex; flex-direction: column; min-height: calc(100vh - 66px); }
  .preview-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .btn { background: var(--accent); color: #06101f; border: 0; padding: 8px 16px; border-radius: 9px; font-weight: 650; cursor: pointer; }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { background: #33415e; color: #8ea0c9; cursor: not-allowed; }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { border-color: var(--muted); background: var(--panel-2); }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .busy { color: var(--accent-2); font-size: 12px; }
  .status { padding: 10px 14px; font-size: 13px; white-space: pre-wrap; border-bottom: 1px solid var(--border); }
  .status.error { color: var(--err); background: rgba(255,107,107,.08); }
  .svg-preview {
    flex: 1; position: relative; overflow: hidden;
    background:
      linear-gradient(45deg, #191d26 25%, transparent 25%, transparent 75%, #191d26 75%),
      linear-gradient(45deg, #191d26 25%, transparent 25%, transparent 75%, #191d26 75%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px; background-color: #12151c;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .svg-preview.grabbing { cursor: grabbing; }
  .svg-preview:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .zoom-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .zoom-stage svg { display: block; width: 100%; height: 100%; }
  .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); pointer-events: none;
  }
  .zoom-ctl { display: inline-flex; align-items: center; gap: 4px; }
  .zoom-ctl .zbtn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; cursor: pointer;
    font-size: 16px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .zoom-ctl .zbtn:hover { color: var(--text); border-color: var(--muted); }
  .zoom-ctl .zbtn:disabled { opacity: .4; cursor: not-allowed; }
  .zoom-ctl .zlabel { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 46px; text-align: center; cursor: pointer; }
  details.src { border-top: 1px solid var(--border); }
  details.src summary { cursor: pointer; padding: 10px 14px; color: var(--muted); }
  details.src pre { margin: 0; padding: 12px 14px; max-height: 240px; overflow: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .foot { color: #6b7385; font-size: 12px; padding: 10px 20px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>raster2svg <span class="sub">&mdash; live converter</span></h1>
  <div class="engine" id="engine"></div>
</header>
<main>
  <section class="controls" aria-label="Controls">
    <div class="upload" id="dropzone" tabindex="0">
      <input type="file" id="file" accept="image/*" hidden>
      <div>Drag &amp; drop an image here, or <button id="browse" type="button">browse</button></div>
      <div class="upload-status" id="uploadStatus"></div>
      <div class="upload-thumb" id="uploadThumb" hidden><img id="thumbImg" alt="Uploaded image"></div>
    </div>

    <div id="groups"></div>

    <div class="preset-row">
      <label for="preset">Preset (base values)</label>
      <select id="preset"><option value="">(none &mdash; engine defaults)</option></select>
      <button class="ghost" id="resetAll" type="button">Reset all</button>
    </div>
    <div class="preset-desc" id="presetDesc" aria-live="polite"></div>

    <fieldset class="user-presets">
      <legend>My presets <span class="note">saved in this browser</span></legend>
      <div class="preset-row">
        <label for="userPresetName">Save current as</label>
        <input id="userPresetName" type="text" placeholder="e.g. logo-tight" maxlength="60" autocomplete="off">
        <button class="ghost" id="userPresetSave" type="button">Save</button>
      </div>
      <div class="preset-row">
        <label for="userPreset">Saved</label>
        <select id="userPreset"><option value="">(none saved)</option></select>
        <button class="ghost" id="userPresetLoad" type="button" disabled>Load</button>
        <button class="ghost" id="userPresetDelete" type="button" title="Delete the selected preset" disabled>&times;</button>
      </div>
    </fieldset>
  </section>

  <section class="preview panel preview-pane" aria-label="Preview">
    <div class="preview-toolbar">
      <button class="btn" id="convertBtn" type="button">Convert</button>
      <button class="btn secondary" id="downloadBtn" type="button" disabled>Download SVG</button>
      <button class="btn secondary" id="sampleBtn" type="button" disabled title="Load the sample SVG (server started with --sample)">Sample</button>
      <span class="zoom-ctl" role="group" aria-label="Zoom">
        <button class="zbtn" id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out" disabled>&minus;</button>
        <span class="zlabel" id="zoomPct" title="Click to fit">100%</span>
        <button class="zbtn" id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in" disabled>&plus;</button>
        <button class="zbtn" id="zoomFit" type="button" title="Fit the whole SVG to the view" aria-label="Fit to view" disabled>Fit</button>
        <button class="zbtn" id="zoom100" type="button" title="Reset zoom to 100% (actual size)" aria-label="Zoom to 100 percent" disabled>100%</button>
      </span>
      <span class="meta" id="meta"></span>
    </div>
    <div class="status" id="status" hidden></div>
    <div class="svg-preview" id="preview" tabindex="0"
          title="Scroll to zoom &middot; drag to pan &middot; double-click to zoom in &middot; + &minus; 1 0 and arrow keys when focused (1 = 100%, 0 = fit)">
      <div class="zoom-stage" id="zoomStage" hidden></div>
      <div class="placeholder" id="placeholder">Upload an image to begin</div>
    </div>
    <details class="src" id="src" hidden>
      <summary>SVG source</summary>
      <pre id="srcCode"></pre>
    </details>
  </section>
</main>
<div class="foot" id="foot"></div>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const state = { session: null, fileName: null, lastSvg: null, info: null, timer: null, busy: false, thumbUrl: null };
const MIN_ZOOM = 0.05, MAX_ZOOM = 16, VIEW_PAD = 16;
const view = { z: 1, x: 0, y: 0, natW: 0, natH: 0 };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const ADVANCED = new Set([
  "simplify","palette","max_colors","optimize","binary_threshold",
  "adaptive","adaptive_window","adaptive_t","watershed_detail"
]);
const FIELD_HINTS = {
  pre_max_colors: "Crush the raster to at most N colors before tracing (Pillow, no dithering). Distinct from Max colors (engine).",
  max_colors: "Engine-side palette cap (needs VTracer 1.0).",
  filter_speckle: "Higher = more speckle removed.",
  color_precision: "Bits per RGB channel (lower = fewer colors).",
  layer_difference: "Color gap between layers (higher = smoother).",
  binary_threshold: "Threshold for black & white mode.",
};

async function init() {
  const res = await fetch("/api/info");
  state.info = await res.json();
  renderHeader();
  renderGroups();
  renderPresets();
  wireUserPresets();
  wireUpload();
  wirePreview();
  $("#convertBtn").addEventListener("click", () => convertNow(false));
  $("#downloadBtn").addEventListener("click", downloadSvg);
  $("#sampleBtn").addEventListener("click", loadSample);
  if (state.info.sample && state.info.sample.name) $("#sampleBtn").disabled = false;
  $("#resetAll").addEventListener("click", resetAll);
  $("#foot").textContent =
    "raster2svg " + state.info.version + " · " + enginesText() +
    " · upload is kept in memory on this machine and expires automatically.";
}

function engineTag(e) {
  const origin = e.origin === "cli" ? "CLI" : (e.origin || "python");
  return e.name + " " + e.version + " (" + origin + ")";
}

function enginesText() {
  const engines = state.info.engines && state.info.engines.length ? state.info.engines : [state.info.engine];
  return engines.map(engineTag).join("  ·  ");
}

function renderHeader() {
  const unav = state.info.unavailable_advanced || [];
  $("#engine").textContent =
    enginesText() +
    (unav.length ? "  ·  " + unav.length + " advanced option(s) need VTracer 1.0" : "");
}

function fieldLabel(field) {
  let range = "";
  if (field.min != null || field.max != null) range = " " + (field.min != null ? field.min : "…") + "–" + (field.max != null ? field.max : "…");
  return field.label + range;
}

function makeControl(field, group) {
  const wrap = document.createElement("div");
  wrap.className = "control";
  const hint = FIELD_HINTS[field.name] || "";
  const unav = field.unavailable ? true : false;
  if (unav) wrap.classList.add("disabled");
  if (field.star) wrap.classList.add("star");

  const label = document.createElement("label");
  label.innerHTML = "<span>" + field.label + "</span>";
  if (field.star) label.innerHTML += ' <span class="starbadge">★</span>';
  if (unav) label.innerHTML += ' <span class="unav">needs VTracer 1.0</span>';
  if (hint) label.title = hint;
  wrap.appendChild(label);

  const input = document.createElement(field.kind === "select" ? "select" : "input");
  input.dataset.field = field.name;
  input.dataset.kind = field.kind;
  const def = (field.default === undefined) ? "" : (field.default === true ? "true" : String(field.default));
  input.dataset.default = def;
  input.disabled = unav;
  if (unav) input.title = field.unavailable_hint || "Not supported by the installed engine.";

  if (field.kind === "select") {
    input.innerHTML = '<option value="">(default)</option>';
    for (const opt of field.options) {
      const o = document.createElement("option");
      o.value = opt.value; o.textContent = opt.label;
      input.appendChild(o);
    }
  } else if (field.kind === "int") {
    input.type = "number"; input.min = field.min; input.max = field.max; input.step = 1;
  } else if (field.kind === "float") {
    input.type = "number"; input.min = field.min; input.max = field.max; input.step = field.kind === "float" ? "any" : 1;
  } else if (field.kind === "bool") {
    input.type = "checkbox"; input.checked = field.default === true;
  } else if (field.kind === "palette") {
    input.type = "text"; input.placeholder = "#111111, #eeeeee, …";
  } else if (field.kind === "resize") {
    input.type = "text"; input.placeholder = "1920x1080";
  }

  if (field.kind === "bool") {
    wrap.classList.add("bool", "wide");
    wrap.appendChild(input);
  } else {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(input);
    const reset = document.createElement("button");
    reset.type = "button"; reset.className = "reset"; reset.textContent = "×";
    reset.title = "Reset to default"; reset.disabled = unav;
    reset.addEventListener("click", () => resetField(field, input));
    row.appendChild(reset);
    wrap.appendChild(row);
    if (field.name === "palette" || field.name === "resize") wrap.classList.add("wide");
  }

  if (!unav) {
    input.addEventListener("input", scheduleConvert);
    input.addEventListener("change", scheduleConvert);
  }
  return wrap;
}

function resetField(field, input) {
  if (field.kind === "bool") input.checked = field.default === true;
  else input.value = "";
  scheduleConvert();
}

function renderGroups() {
  const root = $("#groups");
  root.innerHTML = "";

  root.appendChild(makeFieldset("Preprocessing", state.info.preprocess_fields, false));
  const tracing = state.info.conversion_fields.filter((f) => !ADVANCED.has(f.name));
  const advanced = state.info.conversion_fields.filter((f) => ADVANCED.has(f.name));
  root.appendChild(makeFieldset("Tracing", tracing, false));
  root.appendChild(makeFieldset("Advanced", advanced, true));
}

function makeFieldset(title, fields, isAdvanced) {
  const fs = document.createElement("fieldset");
  if (fields.some((f) => f.star)) fs.classList.add("legend-star");
  const legend = document.createElement("legend");
  legend.textContent = title;
  if (isAdvanced) {
    const unav = fields.filter((f) => f.unavailable).length;
    if (unav) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = " — " + unav + " need VTracer 1.0";
      legend.appendChild(note);
    }
  }
  fs.appendChild(legend);

  const grid = document.createElement("div");
  grid.className = "controls-grid";
  for (const field of fields) grid.appendChild(makeControl(field));
  fs.appendChild(grid);
  return fs;
}

function updatePresetDesc() {
  const name = $("#preset").value;
  const box = $("#presetDesc");
  const info = (state.info.preset_details || {})[name];
  if (!name || !info) { box.hidden = true; box.textContent = ""; return; }
  const parts = [];
  if (info.description) parts.push(info.description);
  if (info.recommended_for && info.recommended_for.length) {
    parts.push('<span class="best">Best for: ' + info.recommended_for.join(", ") + ".</span>");
  }
  box.innerHTML = parts.join(" ");
  box.hidden = false;
}

function renderPresets() {
  const sel = $("#preset");
  for (const name of state.info.presets) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  }
  sel.addEventListener("change", () => { updatePresetDesc(); scheduleConvert(); });
  updatePresetDesc();
}

function collectOptions() {
  const conversion = {};
  const preprocess = {};
  for (const group of [["conversion", state.info.conversion_fields], ["preprocess", state.info.preprocess_fields]]) {
    const target = group[0] === "conversion" ? conversion : preprocess;
    for (const field of group[1]) {
      const el = document.querySelector('input[data-field="' + field.name + '"], select[data-field="' + field.name + '"]');
      if (!el || el.disabled) continue;
      let val;
      if (field.kind === "bool") {
        val = el.checked;
      } else if (field.kind === "palette") {
        const t = el.value.trim();
        val = t ? t.split(",").map((s) => s.trim()).filter(Boolean) : null;
      } else {
        const t = el.value.trim();
        if (t === "") val = null;
        else if (field.kind === "int") val = parseInt(t, 10);
        else if (field.kind === "float") val = parseFloat(t);
        else val = t;
      }
      if (val === null || val === undefined || val === "") continue;
      target[field.name] = val;
    }
  }
  const preset = $("#preset").value || null;
  return { conversion, preprocess, preset };
}

function resetAll() {
  for (const el of document.querySelectorAll("#groups input, #groups select")) {
    const field = el.dataset.field;
    const kind = el.dataset.kind;
    if (kind === "bool") el.checked = el.dataset.default === "true";
    else el.value = "";
  }
  $("#preset").value = "";
  updatePresetDesc();
  scheduleConvert();
}

/* ---- my presets (browser localStorage) ---- */
const USER_PRESETS_KEY = "raster2svg.userPresets.v1";

function loadUserPresets() {
  try {
    const data = JSON.parse(localStorage.getItem(USER_PRESETS_KEY) || "{}");
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch { return {}; }
}

function persistUserPresets(map) {
  try {
    localStorage.setItem(USER_PRESETS_KEY, JSON.stringify(map));
    return true;
  } catch (err) {
    showStatus("Could not write to this browser's storage: " + err, true);
    return false;
  }
}

function renderUserPresets(selectName) {
  const sel = $("#userPreset");
  const map = loadUserPresets();
  sel.innerHTML = "";
  const empty = document.createElement("option");
  empty.value = ""; empty.textContent = "(none saved)";
  sel.appendChild(empty);
  for (const name of Object.keys(map).sort()) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  }
  sel.value = (selectName && map[selectName]) ? selectName : "";
  syncUserPresetButtons();
}

function syncUserPresetButtons() {
  const has = $("#userPreset").value !== "";
  $("#userPresetLoad").disabled = !has;
  $("#userPresetDelete").disabled = !has;
}

function setFieldFromValue(el, field, val) {
  if (field.kind === "bool") { el.checked = val === true; return; }
  if (field.kind === "palette") {
    el.value = Array.isArray(val) ? val.join(", ") : (val === null || val === undefined ? "" : String(val));
    return;
  }
  el.value = (val === null || val === undefined) ? "" : String(val);
}

function applyUserPreset(name) {
  const p = loadUserPresets()[name];
  if (!p) return;
  const conv = (p.conversion && typeof p.conversion === "object") ? p.conversion : {};
  const pre = (p.preprocess && typeof p.preprocess === "object") ? p.preprocess : {};
  for (const field of state.info.conversion_fields) {
    const el = document.querySelector('input[data-field="' + field.name + '"], select[data-field="' + field.name + '"]');
    if (el && !el.disabled) setFieldFromValue(el, field, conv[field.name]);
  }
  for (const field of state.info.preprocess_fields) {
    const el = document.querySelector('input[data-field="' + field.name + '"], select[data-field="' + field.name + '"]');
    if (el && !el.disabled) setFieldFromValue(el, field, pre[field.name]);
  }
  $("#preset").value = (typeof p.preset === "string" && p.preset) ? p.preset : "";
  updatePresetDesc();
  scheduleConvert();
}

function saveNamedPreset() {
  const name = $("#userPresetName").value.trim();
  if (!name) { showStatus("Give the preset a name first.", true); return; }
  const map = loadUserPresets();
  map[name] = Object.assign({ saved_at: new Date().toISOString() }, collectOptions());
  if (!persistUserPresets(map)) return;
  $("#userPresetName").value = "";
  renderUserPresets(name);
  showStatus("Saved preset \u201C" + name + "\u201D in this browser.");
  setTimeout(hideStatus, 3000);
}

function deleteUserPreset() {
  const name = $("#userPreset").value;
  if (!name) return;
  if (!window.confirm('Delete preset "' + name + '"?')) return;
  const map = loadUserPresets();
  delete map[name];
  if (!persistUserPresets(map)) return;
  renderUserPresets("");
  showStatus("Deleted preset \u201C" + name + "\u201D.");
  setTimeout(hideStatus, 3000);
}

function wireUserPresets() {
  renderUserPresets("");
  $("#userPresetSave").addEventListener("click", saveNamedPreset);
  $("#userPresetName").addEventListener("keydown", (e) => { if (e.key === "Enter") saveNamedPreset(); });
  $("#userPresetLoad").addEventListener("click", () => {
    const name = $("#userPreset").value;
    if (!name) return;
    applyUserPreset(name);
    showStatus("Loaded preset \u201C" + name + "\u201D.");
    setTimeout(hideStatus, 3000);
  });
  $("#userPresetDelete").addEventListener("click", deleteUserPreset);
  $("#userPreset").addEventListener("change", syncUserPresetButtons);
}

/* ---- upload ---- */
function wireUpload() {
  const dz = $("#dropzone");
  const file = $("#file");
  $("#browse").addEventListener("click", (e) => { e.stopPropagation(); file.click(); });
  dz.addEventListener("click", () => file.click());
  dz.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") file.click(); });
  file.addEventListener("change", () => { if (file.files && file.files[0]) handleFile(file.files[0]); });
  dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", (e) => {
    e.preventDefault(); dz.classList.remove("drag");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

function setThumb(file) {
  const wrap = $("#uploadThumb");
  const img = $("#thumbImg");
  if (state.thumbUrl) { URL.revokeObjectURL(state.thumbUrl); state.thumbUrl = null; }
  if (!file || !file.type || file.type.indexOf("image/") !== 0) { wrap.hidden = true; return; }
  state.thumbUrl = URL.createObjectURL(file);
  img.src = state.thumbUrl;
  wrap.hidden = false;
}

function handleFile(file) {
  const status = $("#uploadStatus");
  status.style.color = "var(--muted)";
  status.textContent = "Uploading " + file.name + "…";
  setThumb(file);
  const reader = new FileReader();
  reader.onerror = () => { status.style.color = "var(--err)"; status.textContent = "Could not read the file."; };
  reader.onload = async () => {
    const b64 = String(reader.result).split(",")[1];
    try {
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: b64, name: file.name }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      state.session = data.session;
      state.fileName = file.name;
      status.style.color = "var(--ok)";
      status.textContent = file.name + "  ·  " + data.format + "  ·  " + data.width + "×" + data.height + "  ·  " + (data.size_bytes / 1024).toFixed(1) + " KiB";
      $("#downloadBtn").disabled = true;
      convertNow(true);
    } catch (err) {
      status.style.color = "var(--err)";
      status.textContent = err.message;
    }
  };
  reader.readAsDataURL(file);
}

/* ---- convert ---- */
function scheduleConvert() {
  if (!state.session) return;
  clearTimeout(state.timer);
  state.timer = setTimeout(() => convertNow(false), 300);
}

function setBusy(busy) {
  state.busy = busy;
  $("#convertBtn").disabled = busy;
  const meta = $("#meta");
  if (busy) meta.textContent = "Converting…";
}

async function convertNow(resetView) {
  if (!state.session) return;
  setBusy(true);
  hideStatus();
  try {
    const res = await fetch("/api/convert", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: state.session, options: collectOptions() }),
    });
    const data = await res.json();
    if (!res.ok) {
      showStatus((data.error || "Conversion failed") + (data.hint ? "\n" + data.hint : ""), true);
      return;
    }
    state.lastSvg = data.svg;
    renderPreview(data.svg, resetView);
    $("#downloadBtn").disabled = false;
    const ops = data.applied && data.applied.length ? " · " + data.applied.join(", ") : "";
    $("#meta").textContent = (data.bytes / 1024).toFixed(1) + " KiB · " + data.duration_ms + " ms" + ops;
  } catch (err) {
    showStatus("Request failed: " + err, true);
  } finally {
    setBusy(false);
  }
}

function renderPreview(svg, resetView) {
  const stage = $("#zoomStage");
  stage.innerHTML = svg;
  stage.hidden = false;
  $("#placeholder").hidden = true;
  $("#srcCode").textContent = svg;
  $("#src").hidden = false;
  const el = stage.querySelector("svg");
  if (el) {
    const nat = naturalSize(el);
    view.natW = nat.w; view.natH = nat.h;
    // An <svg> with width/height but no viewBox draws its content at a fixed
    // size in the corner when the element is resized. Give it a viewBox equal
    // to its natural size so the content scales with the stage (and the vector
    // is rasterized at the final size — crisp at any zoom).
    if (!el.getAttribute("viewBox")) {
      el.setAttribute("viewBox", "0 0 " + nat.w + " " + nat.h);
    }
  }
  if (resetView) {
    fitView();
    requestAnimationFrame(fitView); // re-fit once the layout has settled
  } else {
    // Keep the current zoom & pan; only re-size the stage for the new content
    // (the natural size can change when a resize/scale option is applied).
    applyView();
  }
}

/* ---- preview: zoom & pan ---- */
function currentSvg() {
  const el = $("#zoomStage").querySelector("svg");
  return el || null;
}

function naturalSize(svg) {
  const wA = parseFloat(svg.getAttribute("width"));
  const hA = parseFloat(svg.getAttribute("height"));
  const vb = svg.viewBox && svg.viewBox.baseVal;
  let w = (isFinite(wA) && wA > 0) ? wA : (vb && vb.width > 0 ? vb.width : 0);
  let h = (isFinite(hA) && hA > 0) ? hA : (vb && vb.height > 0 ? vb.height : 0);
  if (!w || !h) {
    const r = svg.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) { if (!w) w = r.width; if (!h) h = r.height; }
  }
  return { w: w || 100, h: h || 100 };
}

function applyView() {
  const svg = currentSvg();
  const zin = $("#zoomIn"), zout = $("#zoomOut"), zfit = $("#zoomFit"), z100 = $("#zoom100");
  if (!svg) {
    $("#zoomPct").textContent = "100%";
    zin.disabled = zout.disabled = zfit.disabled = z100.disabled = true;
    return;
  }
  // Size the stage to the zoomed pixel size so the browser rasterizes the
  // vector at the final size (crisp at any zoom). Panning is a plain
  // translate, which never scales the raster. (CSS `transform: scale()` would
  // rasterize at the natural size and then stretch the bitmap — the blur.)
  const stage = $("#zoomStage");
  stage.style.width = view.natW * view.z + "px";
  stage.style.height = view.natH * view.z + "px";
  stage.style.transform = "translate(" + view.x + "px, " + view.y + "px)";
  $("#zoomPct").textContent = Math.round(view.z * 100) + "%";
  zin.disabled = view.z >= MAX_ZOOM - 1e-9;
  zout.disabled = view.z <= MIN_ZOOM + 1e-9;
  zfit.disabled = false;
  z100.disabled = false;
}

function setZoom(z, center) {
  const box = $("#preview");
  view.z = z;
  if (center) {
    view.x = (box.clientWidth - view.natW * z) / 2;
    view.y = (box.clientHeight - view.natH * z) / 2;
  }
  applyView();
}

function fitView() {
  if (!currentSvg() || !view.natW || !view.natH) return;
  const box = $("#preview");
  const cW = box.clientWidth, cH = box.clientHeight;
  if (!cW || !cH) return;
  const fit = Math.min((cW - VIEW_PAD * 2) / view.natW, (cH - VIEW_PAD * 2) / view.natH);
  if (fit > 0 && isFinite(fit)) setZoom(fit, true);
}

function reset100() {
  if (!currentSvg()) return;
  setZoom(1, true);
}

function zoomAt(cx, cy, factor) {
  if (!currentSvg()) return;
  const nz = clamp(view.z * factor, MIN_ZOOM, MAX_ZOOM);
  const f = nz / view.z;
  view.x = cx - (cx - view.x) * f;
  view.y = cy - (cy - view.y) * f;
  view.z = nz;
  applyView();
}

function zoomCenter(factor) {
  const box = $("#preview");
  zoomAt(box.clientWidth / 2, box.clientHeight / 2, factor);
}

function wirePreview() {
  const preview = $("#preview");
  $("#zoomIn").addEventListener("click", () => zoomCenter(1.25));
  $("#zoomOut").addEventListener("click", () => zoomCenter(1 / 1.25));
  $("#zoomFit").addEventListener("click", fitView);
  $("#zoom100").addEventListener("click", reset100);
  $("#zoomPct").addEventListener("click", reset100);

  preview.addEventListener("wheel", (e) => {
    if (!currentSvg()) return;
    e.preventDefault();
    const r = preview.getBoundingClientRect();
    const delta = e.deltaMode === 1 ? e.deltaY * 24 : e.deltaY;
    zoomAt(e.clientX - r.left, e.clientY - r.top, clamp(Math.exp(-delta * 0.003), 0.4, 2.5));
  }, { passive: false });

  let drag = null;
  preview.addEventListener("pointerdown", (e) => {
    if (!currentSvg() || (e.button !== 0 && e.button !== 1)) return;
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y, moved: false };
    preview.setPointerCapture(e.pointerId);
  });
  preview.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) {
      drag.moved = true;
      preview.classList.add("grabbing");
    }
    if (drag.moved) { view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); }
  });
  const endDrag = (e) => {
    if (drag && e.pointerId === drag.id) { drag = null; preview.classList.remove("grabbing"); }
  };
  preview.addEventListener("pointerup", endDrag);
  preview.addEventListener("pointercancel", endDrag);

  preview.addEventListener("dblclick", (e) => {
    if (!currentSvg()) return;
    e.preventDefault();
    const r = preview.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, 2);
  });

  preview.addEventListener("keydown", (e) => {
    if (!currentSvg()) return;
    const step = 60;
    let handled = true;
    switch (e.key) {
      case "+": case "=": zoomCenter(1.25); break;
      case "-": case "_": zoomCenter(1 / 1.25); break;
      case "0": case "f": case "F": fitView(); break;
      case "1": reset100(); break;
      case "ArrowLeft": view.x += step; break;
      case "ArrowRight": view.x -= step; break;
      case "ArrowUp": view.y += step; break;
      case "ArrowDown": view.y -= step; break;
      default: handled = false;
    }
    if (handled) { e.preventDefault(); applyView(); }
  });

  window.addEventListener("resize", () => {
    if (!currentSvg()) return;
    const box = $("#preview");
    view.x = (box.clientWidth - view.natW * view.z) / 2;
    view.y = (box.clientHeight - view.natH * view.z) / 2;
    applyView();
  });
}

/* ---- sample SVG (server started with --sample) ---- */
async function loadSample() {
  try {
    const res = await fetch("/api/sample");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    state.lastSvg = data.svg;
    state.fileName = (data.name || "sample").replace(/\.[^.]+$/, "");
    setThumb(null);
    renderPreview(data.svg, true);
    $("#downloadBtn").disabled = false;
    $("#meta").textContent = "sample · " + data.name + " · " + (data.size_bytes / 1024).toFixed(1) + " KiB";
    showStatus("Loaded sample SVG: " + data.name);
    setTimeout(hideStatus, 3000);
  } catch (err) {
    showStatus("Could not load sample: " + err, true);
  }
}

function showStatus(msg, isError) {
  const el = $("#status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
  el.hidden = false;
}
function hideStatus() { $("#status").hidden = true; }

function downloadSvg() {
  if (!state.lastSvg) return;
  const blob = new Blob([state.lastSvg], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const base = (state.fileName || "raster2svg").replace(/\.[^.]+$/, "");
  const a = document.createElement("a");
  a.href = url; a.download = base + ".svg";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

init().catch((err) => {
  showStatus("Failed to load the app: " + err, true);
});
</script>
</body>
</html>
