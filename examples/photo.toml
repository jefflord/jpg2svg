# raster2svg example: photographic color image
#
# Usage:
#   raster2svg convert photo.jpg --config examples/photo.toml
#
# Or copy into a project config:
#   raster2svg config init --preset photo --output raster2svg.toml

[conversion]
clustering = "color-cluster"
hierarchical = "stacked"
mode = "spline"
color_precision = 6
layer_difference = 12
path_precision = 3
filter_speckle = 4

# [preprocess]
# resize = "1920x1080"   # fit within a box, aspect preserved
# denoise = true

# [output]
# overwrite = false
# validate_svg = true
